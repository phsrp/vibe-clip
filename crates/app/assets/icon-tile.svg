<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Vibe Clip's app icon on Windows (the .exe and the taskbar): the glyph in
       white on a rounded violet-to-pink tile that fills the icon. -->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="0.55" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#2e1065" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect x="24" y="24" width="976" height="976" rx="224" fill="url(#plate)"/>
  <rect x="24" y="24" width="976" height="976" rx="224" fill="url(#sheen)"/>
  <g transform="translate(152 152) scale(1.40625)" filter="url(#shadow)">
    <g transform="translate(10 0)" fill="#fff" stroke="#fff" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 238 136 L 238 376 L 430 256 Z" stroke-width="52"/>
      <path d="M 102 178 H 168 M 54 256 H 168 M 102 334 H 168" stroke-width="42" fill="none"/>
    </g>
  </g>
</svg>
